<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>attips Secure Google Sign-in</title>
<style>body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;min-height:100vh;display:grid;place-items:center;color:#202124}.card{background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 14px #0001;text-align:center;width:min(88%,390px)}h2{margin:0 0 12px}p{color:#5f6368;line-height:1.5}#button{display:flex;justify-content:center;margin:24px 0}#status{font-size:14px;color:#5f6368;min-height:22px}#error{color:#b3261e;font-size:14px;white-space:pre-wrap}</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body><main class="card"><h2>attips Admin Login</h2><p>Continue with your registered attips Google account.</p><div id="button"></div><div id="status">Preparing secure sign-in…</div><div id="error"></div></main>
<script>
(function(){
 'use strict';
 const params=new URLSearchParams(location.search);
 const clientId=params.get('client_id');
 const status=document.getElementById('status'),error=document.getElementById('error');
 if(!clientId||!clientId.endsWith('.apps.googleusercontent.com')){status.textContent='';error.textContent='Sign-in configuration missing or invalid. Open Login from the attips Admin App.';return;}
 function onCredential(response){if(!response||!response.credential){error.textContent='Google did not return a sign-in credential.';return;}status.textContent='Sending verified sign-in to Admin…';if(!window.opener||window.opener.closed){error.textContent='Admin window is not available. Close this window and start again.';return;}window.opener.postMessage({type:'ATTIPS_GOOGLE_ID_TOKEN',credential:response.credential},'*');status.textContent='Sign-in sent. You may close this window.';setTimeout(function(){try{window.close()}catch(e){}},900);}
 function init(){if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(init,120);return;}google.accounts.id.initialize({client_id:clientId,callback:onCredential,ux_mode:'popup',auto_select:false});google.accounts.id.renderButton(document.getElementById('button'),{theme:'outline',size:'large',shape:'rectangular',text:'signin_with',width:280});status.textContent='';}
 init();
})();
</script></body></html>
